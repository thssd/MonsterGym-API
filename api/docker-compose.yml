services:
  database:
    image: postgres:16-alpine
    container_name: monstergym-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - monstergym-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d academia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: monstergym-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/academia
    ports:
      - "8080:8080"

volumes:
  monstergym-data: